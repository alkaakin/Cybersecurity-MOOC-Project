{% if user.is_authenticated %}
  <p>Logged in as {{ user.username }}</p>
  <form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Log out</button>
  </form>
{% else %}
  <a href="{% url 'login' %}">Log in</a>
{% endif %}

<form action="{% url 'add' %}" method="post">
  {% csrf_token %}
  <label for="title">Title</label><br>
  <input type="text" id="title" name="title"><br>

  <label for="content">Content</label><br>
  <textarea id="content" name="content" rows="4" cols="40"></textarea><br>

  <button type="submit">Add</button>
</form>

<h1>Entries</h1>
<ul>
  {% for entry in entries %}
    <li><a href="{% url 'detail' entry.id %}">{{ entry.title }}</a> by {{ entry.owner|linebreaksbr }}</li>
  {% empty %}
    <li>No entries yet.</li>
  {% endfor %}
</ul>

<form action="{% url 'search' %}" method="get">
  <label for="q">Search for entries:</label><br>
  <input type="text" id="q" name="q"><br>
  <button type="submit">Search</button>
</form>
